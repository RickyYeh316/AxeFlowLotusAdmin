stages:
  - build
  - deploy

variables:
  # Use cache for node_modules to speed up builds
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
    - .next/cache/

build_app:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - apphosting.yaml
    expire_in: 1 week

deploy_to_firebase:
  stage: deploy
  image: node:20-alpine
  script:
    - npm install -g firebase-tools
    # Deploy only the apphosting backend.
    # Make sure to configure the FIREBASE_TOKEN variable in GitLab Settings > CI/CD > Variables.
    - firebase deploy --only apphosting --project axeflowlotus-6dc3b --token "$FIREBASE_TOKEN" --non-interactive
  dependencies:
    - build_app
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
